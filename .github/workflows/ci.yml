#
# Thin CI wrapper. Dispatches to the org-wide reusable `required`
# aggregator (which calls cpp-ci matrix + security-scan). Subsumes
# the prior inline cmake/ctest workflow AND the placeholder
# required.yml — both removed in the same PR.

name: CI

on:
  push:
    branches: [main]
    # Port release tags use the `<port>@vX.Y.Z` scheme (they do NOT start
    # with `v`). Path filters are not evaluated for tag pushes, so this fires
    # the `release` job below regardless of the `paths:` filter above.
    tags: ["*@v*.*.*"]
    paths: ["packages/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]

# Least-privilege at the workflow level; the only job that needs to write
# code-scanning results (the reusable `gates` aggregator, which runs CodeQL)
# is granted `security-events: write` at the job level below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    uses: resq-software/.github/.github/workflows/required.yml@f4b51a620aa1bf89c0bce4f434b36f92ff7d517d
    with:
      lang: cpp
      cpp-os-list: '["ubuntu-latest","macos-latest","windows-latest"]'
      cpp-source-dir: "packages/resq-common"
      cpp-cmake-flags: "-DRESQ_COMMON_BUILD_TESTS=ON"
      # `codeql-languages` is deliberately omitted. It defaults to "[]",
      # which skips security-scan's CodeQL job.
      #
      # C/C++ is already declared in security.yml, so passing it here ran
      # the same analysis a second time per event — and neither copy was
      # ever stored. Code-scanning *default setup* is enabled on this
      # repository, so every advanced-setup upload is rejected with "CodeQL
      # analyses from advanced configurations cannot be processed when the
      # default setup is enabled". The reusable's `continue-on-error: true`
      # swallowed that error, so the job still reported success. Every
      # CodeQL alert this repository has comes from default setup, which
      # additionally runs the broader `extended` query suite.
    secrets: inherit

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [gates]
    if: always()
    steps:
      - env:
          R: ${{ needs.gates.result }}
        run: |
          set -eu
          case "$R" in
            success|skipped|"") echo "ok: gates=$R" ;;
            *) echo "::error::gates reusable returned: $R"; exit 1 ;;
          esac

  # Publish a GitHub Release per port tag (`<port>@vX.Y.Z`) so the org's
  # changelog aggregator picks the version up — the aggregator ingests GitHub
  # *Releases*, not git tags. Runs only on a tag push, after the `required`
  # gate is green.
  #
  # Each release carries a source archive of the port at the tag and an SPDX
  # JSON SBOM of it, and both are covered by a build-provenance attestation,
  # so anyone can check them with
  # `gh attestation verify <file> --repo resq-software/vcpkg`.
  release:
    name: GitHub Release
    needs: [required]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach its assets
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive the port source at the tag
        id: port
        # Written outside the workspace so the SBOM scan does not see it.
        run: |
          set -euo pipefail
          port="${TAG%@*}"
          version="${TAG##*@}"
          dir="packages/${port}"
          if [ ! -f "${dir}/vcpkg.json" ]; then
            echo "::error::tag ${TAG} names no port: ${dir}/vcpkg.json is missing"
            exit 1
          fi
          stem="${port}-${version}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          git archive --format=tar.gz --prefix="${stem}/" \
            -o "$RUNNER_TEMP/release-assets/${stem}.tar.gz" "${TAG}:${dir}"
          {
            echo "dir=${dir}"
            echo "stem=${stem}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.port.outputs.dir }}
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets/${{ steps.port.outputs.stem }}.spdx.json
          # The last step attaches it to the release.
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Create GitHub Release from the tag
        # `gh` reads $GH_TOKEN and $GH_REPO from the job env; the tag is passed
        # via env (never `${{ }}` inside run:) to avoid zizmor template
        # injection. --generate-notes builds notes from merged PRs since the
        # previous tag; --verify-tag asserts the ref is a real tag first.
        run: |
          set -euo pipefail
          assets=("$RUNNER_TEMP"/release-assets/*)
          # A re-run for an already-released tag attaches only the assets the
          # release lacks. Assets already there stay as they are: each was
          # attested by the run that uploaded it, and nothing published is
          # deleted before its replacement exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching only missing assets."
            attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              name=$(basename "$asset")
              if grep -qxF "$name" <<<"$attached"; then
                echo "keep: $name is already attached"
              else
                gh release upload "$TAG" "$asset"
              fi
            done
            exit 0
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

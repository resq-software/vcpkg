# ── Package scope labels ────────────────────────────────────────────────

"pkg:resq-common":
  - changed-files:
    - any-glob-to-any-file: packages/resq-common/**/*

# ── Area labels ─────────────────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/**/*
      - .git-hooks/**/*
      - .gitattributes

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - "**/CMakeLists.txt"
      - "**/*.cmake"

"A-Ports":
  - changed-files:
    - any-glob-to-any-file: packages/*/vcpkg.json

# ── Category labels ─────────────────────────────────────────────────────

"C-Headers":
  - changed-files:
    - any-glob-to-any-file: packages/*/include/**/*

"C-Testing":
  - changed-files:
    - any-glob-to-any-file: packages/*/tests/**/*

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*